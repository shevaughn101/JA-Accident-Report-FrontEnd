<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Insurance Company Admin - JA Accident Report</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: "#009b3a",
                        insurance: "#2563eb" 
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Atkinson Hyperlegible Next"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 font-body text-slate-800 min-h-screen relative overflow-x-hidden">
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-8 border-b border-slate-200">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-insurance/10 text-insurance flex items-center justify-center border border-insurance/30">
                <span class="material-symbols-outlined text-[20px]">corporate_fare</span>
            </div>
            <span id="header-company" class="font-headline font-bold text-lg text-slate-900 tracking-wide">Insurance Company Portal</span>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="logout-btn" class="text-slate-500 hover:text-red-500 transition-colors text-sm font-bold tracking-wider uppercase flex items-center gap-1">
                Logout <span class="material-symbols-outlined text-[18px]">logout</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 mb-20 animate-fade-in">
        
        <div class="mb-8">
            <h1 class="font-headline text-3xl font-bold text-slate-900 mb-1">Agent Dashboard</h1>
            <p class="text-slate-600 text-sm font-label tracking-wide">Issue new policies and manage client billing.</p>
        </div>

        <section class="glass-panel rounded-2xl p-8 shadow-xl relative overflow-hidden mb-8">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-insurance to-blue-400"></div>

            <h2 class="font-headline text-xl font-bold text-slate-900 mb-6 flex items-center gap-2 border-b border-slate-200 pb-4">
                <span class="material-symbols-outlined text-insurance">post_add</span>
                Issue New Client Policy
            </h2>

            <div id="policy-status-msg" class="hidden mb-6 px-4 py-3 rounded-lg text-sm font-label text-center"></div>

            <form id="create-policy-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Client Email (Civilian Account)</label>
                        <input type="email" id="policy-user-email" class="w-full rounded-lg border-slate-300 focus:border-insurance focus:ring-insurance px-4 py-3" placeholder="client@example.com" required/>
                    </div>
                    <div>
                        <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Generated Policy Number</label>
                        <input type="text" id="policy-number" class="w-full rounded-lg border-slate-300 focus:border-insurance focus:ring-insurance px-4 py-3 uppercase font-mono tracking-wider" placeholder="e.g. BCIC-109283" required/>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Your Company</label>
                        <select id="policy-company" class="w-full rounded-lg border-slate-300 focus:border-insurance focus:ring-insurance px-4 py-3" required>
                            <option value="Advantage General Insurance">Advantage General</option>
                            <option value="BCIC">BCIC (British Caribbean)</option>
                            <option value="JN General Insurance">JN General</option>
                            <option value="General Accident Insurance">General Accident</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Premium Amount (JMD)</label>
                        <input type="number" id="policy-amount" class="w-full rounded-lg border-slate-300 focus:border-insurance focus:ring-insurance px-4 py-3" placeholder="15000" required/>
                    </div>
                    <div>
                        <label class="block font-label text-xs font-bold mb-2 uppercase tracking-wider text-slate-700">Next Due Date</label>
                        <input type="date" id="policy-date" class="w-full rounded-lg border-slate-300 focus:border-insurance focus:ring-insurance px-4 py-3" required/>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200 flex justify-end">
                    <button type="submit" id="policy-submit-btn" class="bg-insurance text-white font-bold font-label px-8 py-3 rounded-lg hover:bg-blue-700 transition-all shadow-md flex items-center gap-2">
                        Issue Policy
                        <span class="material-symbols-outlined text-[18px]">send</span>
                    </button>
                </div>
            </form>
        </section>

    </main>

    <script type="module">
        import { auth, apiFetch } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Must be an admin to use this portal for now (since insurance agents are technically admins in our prototype)
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const token = await user.getIdTokenResult();
                const isSuperAdmin = token.claims.role === 'admin' || token.claims.admin === true || user.email === 'admin@ja-accident-report.com' || user.email === 'shevaughn@example.com';
                const isAgent = token.claims.role === 'insurance_agent';
                
                if (!isSuperAdmin && !isAgent) {
                    alert("Unauthorized. This portal is for Insurance Agents only.");
                    window.location.href = 'index.html';
                    return;
                }
                
                // If they are a specific agent, lock the company dropdown to their company
                if (isAgent && token.claims.company) {
                    const companySelect = document.getElementById('policy-company');
                    companySelect.innerHTML = `<option value="${token.claims.company}">${token.claims.company}</option>`;
                    companySelect.disabled = true;
                    
                    document.getElementById('header-company').textContent = `${token.claims.company} Portal`;
                }
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('create-policy-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('policy-submit-btn');
            const msgBox = document.getElementById('policy-status-msg');
            msgBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span>';

            const payload = {
                user_email: document.getElementById('policy-user-email').value.trim(),
                policy_number: document.getElementById('policy-number').value.trim().toUpperCase(),
                company: document.getElementById('policy-company').value,
                payment_amount: parseFloat(document.getElementById('policy-amount').value),
                next_payment_date: document.getElementById('policy-date').value
            };

            try {
                const response = await apiFetch('https://ja-accident-report-backend.onrender.com/api/admin/policy', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Creation failed");

                msgBox.textContent = `Successfully issued Policy ${payload.policy_number} to ${payload.user_email}`;
                msgBox.className = "mb-6 px-4 py-3 rounded-lg text-sm font-label text-center bg-green-100 text-green-700 font-bold border border-green-200";
                msgBox.classList.remove('hidden');
                document.getElementById('create-policy-form').reset();
            } catch (err) {
                msgBox.textContent = err.message;
                msgBox.className = "mb-6 px-4 py-3 rounded-lg text-sm font-label text-center bg-red-100 text-red-700 font-bold border border-red-200";
                msgBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Issue Policy <span class="material-symbols-outlined text-[18px]">send</span>';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = 'login.html'; });
        });
    </script>
</body>
</html>
