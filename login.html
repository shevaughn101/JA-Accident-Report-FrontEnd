<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JA Accident" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/shevaughn101/JA-Accident-Report-BackEnd/main/mobile-app/assets/icon.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - JA Accident Report</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: "#009b3a",
                        gold: "#fed100",
                        amber: "#f59e0b"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Atkinson Hyperlegible Next"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined, .material-icons {
            font-family: 'Material Symbols Outlined', 'Material Icons', sans-serif !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #0f172a !important;
        }

        .glass-input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        body {
            background: radial-gradient(circle at top right, #f8fafc, #e2e8f0);
            background-attachment: fixed;
            color: #0f172a;
        }
    </style>
</head>

<body class="font-body min-h-screen flex flex-col items-center justify-center px-4 py-3 sm:px-6 sm:py-8 antialiased">

    <div class="w-full max-w-md mx-auto transition-all duration-300 animate-slide-up">
        <div class="text-center mb-3 sm:mb-5">
            <div
                class="inline-flex items-center justify-center w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-gold text-slate-900 mb-2 shadow-[0_4px_15px_rgba(16,185,129,0.3)]">
                <svg class="w-6 h-6 sm:w-8 sm:h-8 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.89-7 10.02-3.87-1.13-7-5.35-7-10.02V6.3l7-3.12z"/>
                </svg>
            </div>
            <h1 class="font-headline text-xl sm:text-2xl font-bold text-slate-900 mb-0.5 tracking-tight">JA Accident Report</h1>
            <p class="text-slate-600 text-xs sm:text-sm font-label tracking-wide">Secure Authentication Portal</p>
        </div>

        <!-- Responsive Role Switcher: Flex Container with Defined Gap (8px to 12px) & Compact Mobile Padding -->
        <div class="flex items-stretch gap-2 sm:gap-3 mb-3 sm:mb-5 w-full">

            <label class="flex-1 cursor-pointer group relative min-w-0">
                <input type="radio" name="role" value="civilian" id="role-civilian" class="peer sr-only" checked />
                <div
                    class="glass-panel rounded-xl sm:rounded-2xl py-2 px-1.5 sm:py-3.5 sm:px-3 text-center transition-all duration-200 peer-checked:bg-white peer-checked:border-emerald-500 peer-checked:shadow-md peer-checked:ring-2 peer-checked:ring-emerald-500/20 hover:bg-white/80 h-full flex flex-col items-center justify-center border border-slate-200/60">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 mb-1 text-slate-400 peer-checked:text-emerald transition-colors shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <h3 class="font-bold text-xs sm:text-sm text-slate-900 leading-tight truncate">Civilian</h3>
                    <p class="text-[10px] sm:text-[11px] text-slate-500 hidden sm:block mt-0.5 truncate">Report Incident</p>
                </div>
            </label>

            <label class="flex-1 cursor-pointer group relative min-w-0">
                <input type="radio" name="role" value="officer" id="role-officer" class="peer sr-only" />
                <div
                    class="glass-panel rounded-xl sm:rounded-2xl py-2 px-1.5 sm:py-3.5 sm:px-3 text-center transition-all duration-200 peer-checked:bg-white peer-checked:border-amber-500 peer-checked:shadow-md peer-checked:ring-2 peer-checked:ring-amber-500/20 hover:bg-white/80 h-full flex flex-col items-center justify-center border border-slate-200/60">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 mb-1 text-slate-400 peer-checked:text-amber transition-colors shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4.5l1.66 3.36 3.71.54-2.68 2.62.63 3.69L12 14l-3.32 1.71.63-3.69-2.68-2.62 3.71-.54L12 5.5z"/>
                    </svg>
                    <h3 class="font-bold text-xs sm:text-sm text-slate-900 leading-tight truncate">Officer</h3>
                    <p class="text-[10px] sm:text-[11px] text-slate-500 hidden sm:block mt-0.5 truncate">Police Portal</p>
                </div>
            </label>

            <label class="flex-1 cursor-pointer group relative min-w-0">
                <input type="radio" name="role" value="insurance" id="role-insurance" class="peer sr-only" />
                <div
                    class="glass-panel rounded-xl sm:rounded-2xl py-2 px-1.5 sm:py-3.5 sm:px-3 text-center transition-all duration-200 peer-checked:bg-white peer-checked:border-blue-500 peer-checked:shadow-md peer-checked:ring-2 peer-checked:ring-blue-500/20 hover:bg-white/80 h-full flex flex-col items-center justify-center border border-slate-200/60">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 mb-1 text-slate-400 peer-checked:text-blue-500 transition-colors shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                    </svg>
                    <h3 class="font-bold text-xs sm:text-sm text-slate-900 leading-tight truncate">Agent</h3>
                    <p class="text-[10px] sm:text-[11px] text-slate-500 hidden sm:block mt-0.5 truncate">Insurance Desk</p>
                </div>
            </label>

        </div>

        <!-- Form Card: 100% Width on Mobile, max-w-md on Desktop with Responsive Padding -->
        <div class="glass-panel rounded-2xl p-4 sm:p-7 shadow-xl relative overflow-hidden w-full">

            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald via-amber to-emerald"></div>

            <div id="error-message"
                class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 px-3.5 py-2.5 rounded-lg text-xs font-label">
            </div>

            <form id="login-form" class="space-y-3 sm:space-y-4">
                <div>
                    <label class="block font-label text-xs font-bold mb-1.5 uppercase tracking-wider text-slate-700">Email Address</label>
                    <input type="email" id="email" required
                        class="glass-input w-full rounded-lg px-3.5 py-2.5 sm:py-3 transition-shadow text-sm"
                        placeholder="name@example.com">
                </div>

                <div class="relative">
                    <div class="flex justify-between items-center gap-2 mb-1.5">
                        <label class="block font-label text-xs font-bold uppercase tracking-wider text-slate-700 truncate">Password</label>
                        <button type="button" id="forgot-password-btn" class="text-xs font-bold text-emerald hover:text-emerald-700 hover:underline transition-all shrink-0 ml-auto text-right cursor-pointer">Forgot Password?</button>
                    </div>
                    <input type="password" id="password" required
                        class="glass-input w-full rounded-lg px-3.5 py-2.5 sm:py-3 transition-shadow text-sm" placeholder="••••••••">
                </div>

                <div id="signup-toggle-container" class="w-full">
                    <label class="flex items-start gap-2.5 cursor-pointer group select-none">
                        <input type="checkbox" id="is-signup"
                            class="rounded border-slate-300 text-emerald focus:ring-emerald mt-0.5 shrink-0 w-4 h-4 cursor-pointer">
                        <span class="text-xs sm:text-sm text-slate-600 group-hover:text-slate-900 transition-colors leading-snug">
                            I don't have an account (Civilian Sign up)
                        </span>
                    </label>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-gold text-slate-900 font-bold py-2.5 sm:py-3 px-4 rounded-lg hover:bg-gold/90 transition-all shadow-md flex justify-center items-center gap-2 group text-sm cursor-pointer">
                    <svg id="btn-spinner" class="w-4 h-4 animate-spin hidden shrink-0" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="btn-text">Secure Login</span>
                    <svg id="btn-icon" class="w-4 h-4 group-hover:translate-x-1 transition-transform shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
                    </svg>
                </button>
            </form>

            <div id="social-logins" class="mt-3.5 pt-3 sm:mt-5 sm:pt-4 border-t border-slate-200">
                <p class="text-center text-[11px] sm:text-xs text-slate-500 font-bold uppercase tracking-wider mb-2.5">Or continue with</p>
                <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
                    <button id="google-login" type="button"
                        class="glass-input py-2 rounded-lg hover:bg-slate-50 transition-colors flex justify-center items-center cursor-pointer">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4 sm:w-5 sm:h-5" alt="Google">
                    </button>
                    <button id="apple-login" type="button"
                        class="glass-input py-2 rounded-lg hover:bg-slate-50 transition-colors flex justify-center items-center opacity-50 cursor-not-allowed"
                        title="Apple Login (Requires Paid Apple Developer Account)">
                        <img src="https://www.svgrepo.com/show/511330/apple-173.svg" class="w-4 h-4 sm:w-5 sm:h-5" alt="Apple">
                    </button>
                    <button id="facebook-login" type="button"
                        class="glass-input py-2 rounded-lg hover:bg-slate-50 transition-colors flex justify-center items-center cursor-pointer"
                        title="Facebook Login">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-4 h-4 sm:w-5 sm:h-5" alt="Facebook">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            auth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signInWithPopup,
            googleProvider,
            appleProvider,
            facebookProvider,
            sendEmailVerification,
            sendPasswordResetEmail
        } from './firebase-config.js';

        const form = document.getElementById('login-form');
        const roleCivilian = document.getElementById('role-civilian');
        const roleOfficer = document.getElementById('role-officer');
        const roleInsurance = document.getElementById('role-insurance');
        const signupToggleContainer = document.getElementById('signup-toggle-container');
        const isSignup = document.getElementById('is-signup');
        const btnText = document.getElementById('btn-text');
        const socialLogins = document.getElementById('social-logins');
        const errorMsg = document.getElementById('error-message');

        function updateUI() {
            if (roleOfficer.checked) {
                signupToggleContainer.classList.add('hidden');
                socialLogins.classList.add('hidden');
                isSignup.checked = false;
                btnText.textContent = 'Officer Login';
            } else if (roleInsurance.checked) {
                signupToggleContainer.classList.add('hidden');
                socialLogins.classList.add('hidden');
                isSignup.checked = false;
                btnText.textContent = 'Agent Login';
            } else {
                signupToggleContainer.classList.remove('hidden');
                socialLogins.classList.remove('hidden');
                btnText.textContent = isSignup.checked ? 'Create Account' : 'Civilian Login';
            }
        }

        roleCivilian.addEventListener('change', updateUI);
        roleOfficer.addEventListener('change', updateUI);
        roleInsurance.addEventListener('change', updateUI);
        isSignup.addEventListener('change', updateUI);

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            errorMsg.classList.add('animate-fade-in');
        }

        async function handleAuthSuccess(userCredential) {
            try {
                const token = await userCredential.user.getIdToken();
                const response = await fetch('https://ja-accident-report-backend.onrender.com/api/auth/verify', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("Backend verification failed");

                const data = await response.json();

                if (data.role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                }
                else if (data.role === 'insurance_agent') {
                    window.location.href = 'insurance_admin.html';
                }
                else if (data.role === 'officer') {
                    if (roleCivilian.checked) throw new Error("Please use the Officer Portal");
                    window.location.href = 'officer_feed.html';
                }
                else {
                    if (roleOfficer.checked) throw new Error("Unauthorized for Officer Portal");
                    window.location.href = 'civilian_dashboard.html';
                }
            } catch (err) {
                showError(err.message);
                auth.signOut(); 
            }
        }

        document.getElementById('forgot-password-btn').addEventListener('click', async () => {
            const emailInput = document.getElementById('email').value;
            if (!emailInput) {
                showError("Please enter your email address first, then click 'Forgot Password?'");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, emailInput);
                errorMsg.classList.replace('text-red-700', 'text-emerald-700');
                errorMsg.classList.replace('bg-red-50', 'bg-emerald-50');
                errorMsg.classList.replace('border-red-200', 'border-emerald-200');
                showError("Password reset email sent! Please check your inbox.");
            } catch (err) {
                errorMsg.classList.replace('text-emerald-700', 'text-red-700');
                errorMsg.classList.replace('bg-emerald-50', 'bg-red-50');
                errorMsg.classList.replace('border-emerald-200', 'border-red-200');
                showError(err.message);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            document.getElementById('btn-spinner').classList.remove('hidden');
            document.getElementById('btn-icon').classList.add('hidden');

            const slowBootTimer = setTimeout(() => {
                showError("Waking up the secure server... this can take up to 60 seconds on the free tier. Please wait.");
                errorMsg.classList.replace('text-red-700', 'text-emerald-700');
                errorMsg.classList.replace('bg-red-50', 'bg-emerald-50');
                errorMsg.classList.replace('border-red-200', 'border-emerald-200');
            }, 3000);

            try {
                if (isSignup.checked && roleCivilian.checked) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(cred.user);
                    auth.signOut();

                    errorMsg.classList.replace('text-red-700', 'text-emerald-700');
                    errorMsg.classList.replace('bg-red-50', 'bg-emerald-50');
                    errorMsg.classList.replace('border-red-200', 'border-emerald-200');
                    showError("Account created! Please check your email to verify your account before logging in.");
                } else {
                    const cred = await signInWithEmailAndPassword(auth, email, password);

                    const isManual = cred.user.providerData.some(p => p.providerId === 'password');

                    if (isManual && !cred.user.emailVerified) {
                        auth.signOut();
                        throw { code: 'auth/unverified-email', message: "Your email is not verified. Please check your inbox to verify it before logging in." };
                    }

                    await handleAuthSuccess(cred);
                }
            } catch (err) {
                errorMsg.classList.replace('text-emerald-700', 'text-red-700');
                errorMsg.classList.replace('bg-emerald-50', 'bg-red-50');
                errorMsg.classList.replace('border-emerald-200', 'border-red-200');
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-login-credentials') {
                    showError("Account not found or invalid credentials. Please click 'Sign Up' to create a new account.");
                } else if (err.code === 'auth/email-already-in-use') {
                    showError("Email is already in use. Please uncheck 'Sign up' and log in.");
                } else {
                    showError(err.message);
                }
            } finally {
                clearTimeout(slowBootTimer);
                submitBtn.disabled = false;
                document.getElementById('btn-spinner').classList.add('hidden');
                document.getElementById('btn-icon').classList.remove('hidden');
                updateUI(); 
            }
        });

        document.getElementById('google-login').addEventListener('click', async () => {
            errorMsg.classList.add('hidden');
            try {
                googleProvider.setCustomParameters({ prompt: 'select_account' });
                const cred = await signInWithPopup(auth, googleProvider);
                await handleAuthSuccess(cred);
            } catch (err) {
                if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
                    showError("Login cancelled.");
                } else {
                    showError("Google Login Failed: " + err.message);
                }
            }
        });

        document.getElementById('apple-login').addEventListener('click', async () => {
            errorMsg.classList.add('hidden');
            try {
                const cred = await signInWithPopup(auth, appleProvider);
                await handleAuthSuccess(cred);
            } catch (err) {
                if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
                    showError("Login cancelled.");
                } else {
                    showError("Apple Login Failed: " + err.message);
                }
            }
        });

        document.getElementById('facebook-login').addEventListener('click', async () => {
            errorMsg.classList.add('hidden');
            try {
                const cred = await signInWithPopup(auth, facebookProvider);
                await handleAuthSuccess(cred);
            } catch (err) {
                if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
                    showError("Login cancelled.");
                } else {
                    showError("Facebook Login Failed: " + err.message);
                }
            }
        });
    </script>
</body>

</html>
